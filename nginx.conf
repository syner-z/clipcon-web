# clipcon-web 정적 서빙 + /api 리버스 프록시
# dev 서버의 vite server.proxy 역할을 운영 환경에서 대신한다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA 라우팅: 존재하지 않는 경로는 index.html로 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 빌드 산출물은 내용 해시 파일명이라 길게 캐시해도 안전하다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /api 요청은 백엔드 컨테이너로 전달한다 (compose 서비스명: server)
    location /api/ {
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 전역 nginx(https)가 보낸 체계를 그대로 전달한다. 여기서 $scheme로
        # 덮어쓰면 https 연결이 http로 보여서 쿠키·리다이렉트가 깨질 수 있다.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # 영상 처리·미디어 다운로드 응답이 길 수 있어 버퍼링을 끄고 타임아웃을 늘린다
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }
}
